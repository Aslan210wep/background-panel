<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Control - Cihaz Yönetim Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #1e293b; }
        .logo-title { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .status-badge { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 14px; background: rgba(239, 68, 68, 0.1); color: #ef4444; }
        .status-badge.online { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
        .stat-box { background: #0f172a; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; }
        .stat-label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        .stat-value { font-size: 14px; font-weight: 600; color: #f8fafc; }
        .notifications-list { margin-top: 12px; }
        .notif-item { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px; border-left: 3px solid #3b82f6; }
        .notif-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .notif-text { font-size: 13px; color: #94a3b8; }
        .notif-time { font-size: 11px; color: #64748b; margin-top: 4px; text-align: right; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">
            <div class="logo-icon">⚡</div>
            <div>
                <h2>Background Control</h2>
                <span style="font-size: 12px; color: #94a3b8;">Device Management Panel</span>
            </div>
        </div>
        <div id="main-status" class="status-badge">
            <span class="dot"></span>
            <span id="main-status-text">Çevrimdışı</span>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div style="display: flex; align-items: center; gap: 12px;">
                <span style="font-size: 24px;">📱</span>
                <div>
                    <h3>Android Cihaz</h3>
                    <span id="device-subtext" style="font-size: 12px; color: #94a3b8;">BackgroundApp • v1.0</span>
                </div>
            </div>
            <div id="device-status" class="status-badge">
                <span class="dot"></span>
                <span id="device-status-text">Çevrimdışı</span>
            </div>
        </div>

        <div class="grid">
            <div class="stat-box">
                <div class="stat-label">Cihaz ID</div>
                <div class="stat-value" id="stat-device-id">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Son Bağlantı</div>
                <div class="stat-value" id="stat-last-seen">-</div>
            </div>
        </div>
    </div>

    <div class="card">
        <h3>Gelen Bildirimler</h3>
        <div id="notifications-container" class="notifications-list">
            <p style="color: #64748b; font-size: 13px;">Henüz bildirim yok...</p>
        </div>
    </div>

    <script>
        async function updatePanelData() {
            try {
                const response = await fetch('/api/data');
                if (!response.ok) return;
                const data = await response.json();

                if (data.devices && data.devices.length > 0) {
                    const latestDevice = data.devices[0];
                    document.getElementById('stat-device-id').innerText = latestDevice.device_id || 'Bilinmiyor';
                    document.getElementById('stat-last-seen').innerText = latestDevice.timestamp || '-';

                    const isOnline = latestDevice.status === 'online';
                    const mainStatus = document.getElementById('main-status');
                    const deviceStatus = document.getElementById('device-status');

                    if (isOnline) {
                        mainStatus.className = 'status-badge online';
                        deviceStatus.className = 'status-badge online';
                        document.getElementById('main-status-text').innerText = 'Çevrimiçi';
                        document.getElementById('device-status-text').innerText = 'Çevrimiçi';
                    } else {
                        mainStatus.className = 'status-badge';
                        deviceStatus.className = 'status-badge';
                        document.getElementById('main-status-text').innerText = 'Çevrimdışı';
                        document.getElementById('device-status-text').innerText = 'Çevrimdışı';
                    }
                }

                if (data.notifications && data.notifications.length > 0) {
                    const container = document.getElementById('notifications-container');
                    container.innerHTML = '';
                    data.notifications.forEach(notif => {
                        const item = document.createElement('div');
                        item.className = 'notif-item';
                        item.innerHTML = `
                            <div class="notif-title">${notif.title || 'Başlıksız'} <span style="font-weight: normal; font-size: 11px; color: #64748b;">(${notif.package_name || ''})</span></div>
                            <div class="notif-text">${notif.text || ''}</div>
                            <div class="notif-time">${notif.timestamp || ''}</div>
                        `;
                        container.appendChild(item);
                    });
                }
            } catch (err) {
                console.error('Veri çekme hatası:', err);
            }
        }

        updatePanelData();
        setInterval(updatePanelData, 3000);
    </script>
</body>
</html>
