<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Control - Cihaz Yönetim Paneli</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; padding: 16px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .logo-title { display: flex; align-items: center; gap: 12px; }
        .logo-icon { width: 38px; height: 38px; background: #3b82f6; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .status-badge { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 13px; background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .status-badge.online { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; }
        .card { background: #131b2e; border-radius: 16px; padding: 16px; border: 1px solid #1e293b; margin-bottom: 16px; }
        .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .stat-box { background: #0b0f19; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; }
        .stat-label { font-size: 12px; color: #64748b; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .stat-value { font-size: 14px; font-weight: 600; color: #f8fafc; }
        .perm-box { background: #0b0f19; padding: 12px; border-radius: 12px; border: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
        .notif-item { background: #0b0f19; border-radius: 10px; padding: 12px; margin-top: 8px; border-left: 3px solid #3b82f6; }
        .notif-title { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
        .notif-text { font-size: 12px; color: #94a3b8; }
        .notif-time { font-size: 10px; color: #64748b; margin-top: 4px; text-align: right; }
        .badge-green { color: #22c55e; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">
            <div class="logo-icon">⚡</div>
            <div>
                <h3 style="font-size: 16px;">Background Control</h3>
                <span style="font-size: 11px; color: #64748b;">Device Management Panel</span>
            </div>
        </div>
        <div id="main-status" class="status-badge">
            <span class="dot"></span>
            <span id="main-status-text">Çevrimdışı</span>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 20px;">📱</span>
                <div>
                    <h4 id="device-title" style="font-size: 15px;">Android Cihaz</h4>
                    <span style="font-size: 11px; color: #64748b;">BackgroundApp • v1.0</span>
                </div>
            </div>
            <div id="device-status" class="status-badge">
                <span class="dot"></span>
                <span id="device-status-text">Çevrimdışı</span>
            </div>
        </div>

        <div class="grid">
            <div class="stat-box">
                <div class="stat-label">🤖 Android</div>
                <div class="stat-value" id="val-android">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🔋 Pil</div>
                <div class="stat-value" id="val-battery">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🌐 İnternet</div>
                <div class="stat-value" id="val-internet">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">📶 Bağlantı</div>
                <div class="stat-value" id="val-connection">Aktif</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">📦 Uygulama</div>
                <div class="stat-value">1.0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">🕒 Son Bağlantı</div>
                <div class="stat-value" id="val-lastseen">-</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
            <span style="font-size: 18px;">🔑</span>
            <div>
                <h4 style="font-size: 14px;">İzinler</h4>
                <span style="font-size: 11px; color: #64748b;">Cihaz izin durumu</span>
            </div>
        </div>
        <div>
            <div class="perm-box">
                <span style="font-size: 13px;">🔔 Bildirim Erişimi</span>
                <span id="perm-notif" class="badge-green">Aktif</span>
            </div>
            <div class="perm-box">
                <span style="font-size: 13px;">⚡ Arka Plan Çalışma</span>
                <span id="perm-bg" class="badge-green">İzin Verildi</span>
            </div>
